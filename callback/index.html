<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla login done</title></head>
<body style="font-family:sans-serif;padding:24px;max-width:600px">
<h2>Tesla login complete</h2><p>Copy this code and paste it back into the chat's secure box:</p>
<textarea id="c" readonly style="width:100%;height:120px;font-size:14px"></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Copied'">Copy code</button></p>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||('No code found. '+(p.get('error_description')||p.get('error')||''));</script>
</body></html>
